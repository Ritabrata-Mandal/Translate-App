<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="/Translate.png?v=2">

<body>
    <div class="container">
        <div class="Text">
            <textarea name="" id="fromText" placeholder="Enter Text"></textarea>
            <textarea name="" id="toText" placeholder="Translated Text"></textarea>
        </div> 
        
        <div class="selectArea">
            <div class="select1">
                <img src="speaker.svg" alt="speaker" class="speaker" id="from">
                <img src="copy.svg" alt="copy" class="copy" id="from">
                <select id="fselect">
                </select>
            </div>
            <div class="select2">
                <img src="speaker.svg" alt="speaker" class="speaker" id="to">
                <img src="copy.svg" alt="copy" class="copy" id="to">
                <select id="sselect">
                </select>
            </div>
        </div>

        <div><button type="button" id="transfer">Translate</button></div>
    </div>

    <div id="toast">Copied Successfully</div>

    <script src="countries.js"></script>
    <script src="script.js"></script>

</html>
